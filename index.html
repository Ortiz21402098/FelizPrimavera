<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Primavera!</title>
    <style>
        /* Variables de colores y estilos base */
        :root {
            --bg-color: #fcf8f2;
            --primary-color: #e5a93c;
            --stem-color: #2e7d32;
            --petal-color: #ffd54f;
            --text-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Contenedor Principal (Tarjeta) */
        .card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 450px;
            padding: 30px 20px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
        }

        h1 {
            color: #d97706;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        p.intro {
            color: #666;
            font-size: 1rem;
            margin-bottom: 25px;
        }

        /* Botón Sorpresa */
        .btn-surprise {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-surprise:active {
            transform: scale(0.95);
        }

        /* Sección de la Sorpresa (Oculta al inicio) */
        .surprise-container {
            display: none;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            margin-top: 20px;
        }

        .surprise-container.show {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 1;
        }

        /* Animación de la Flor Amarilla en CSS */
        .flower-wrapper {
            position: relative;
            width: 150px;
            height: 220px;
            margin: 20px 0;
        }

        .flower-center {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 45px;
            height: 45px;
            background: #8d5b4c;
            border-radius: 50%;
            z-index: 2;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.3);
        }

        .petals {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 45px;
            height: 45px;
            z-index: 1;
        }

        .petal {
            position: absolute;
            background: var(--petal-color);
            width: 35px;
            height: 80px;
            border-radius: 50% 50% 50% 50% / 80% 80% 20% 20%;
            left: 5px;
            top: -17px;
            transform-origin: bottom center;
            box-shadow: inset 0 -5px 10px rgba(245, 158, 11, 0.5);
        }

        /* Generar distribución circular para los pétalos */
        .petal:nth-child(1)  { transform: rotate(0deg); }
        .petal:nth-child(2)  { transform: rotate(45deg); }
        .petal:nth-child(3)  { transform: rotate(90deg); }
        .petal:nth-child(4)  { transform: rotate(135deg); }
        .petal:nth-child(5)  { transform: rotate(180deg); }
        .petal:nth-child(6)  { transform: rotate(225deg); }
        .petal:nth-child(7)  { transform: rotate(270deg); }
        .petal:nth-child(8)  { transform: rotate(315deg); }

        /* Tallo y Hojas */
        .stem {
            position: absolute;
            top: 72px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 130px;
            background: var(--stem-color);
            border-radius: 4px;
            z-index: 0;
        }

        .leaf {
            position: absolute;
            width: 30px;
            height: 15px;
            background: var(--stem-color);
            border-radius: 100px 0px 100px 0px;
        }

        .leaf.left {
            top: 130px;
            left: 38px;
            transform: rotate(-25deg);
        }

        .leaf.right {
            top: 110px;
            right: 38px;
            transform: scaleX(-1) rotate(-25deg);
        }

        /* Mensaje Especial */
        .message-box {
            background: #fffbe3;
            border: 1px solid #fef3c7;
            border-radius: 12px;
            padding: 18px;
            margin-top: 15px;
            color: #4b5563;
            font-size: 1.05rem;
            line-height: 1.6;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .message-box strong {
            color: #d97706;
        }

        /* Efecto de flores cayendo (Confeti primaveral) */
        .falling-flower {
            position: fixed;
            top: -20px;
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            animation: fall linear infinite;
            z-index: 100;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div id="initial-content">
            <h1>¡Hola, mi amor! 🌼</h1>
            <p class="intro">Tengo una pequeña sorpresa especial de primavera para vos...</p>
            <button class="btn-surprise" onclick="mostrarSorpresa()">Ver sorpresa ✨</button>
        </div>

        <div class="surprise-container" id="surprise">
            <h1>¡Feliz Día de la Primavera! 🌻</h1>
            
            <div class="flower-wrapper">
                <div class="stem"></div>
                <div class="leaf left"></div>
                <div class="leaf right"></div>
                <div class="flower-center"></div>
                <div class="petals">
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                </div>
            </div>

            <div class="message-box">
                Gracias por estar siempre a mi lado, por apoyarme en cada momento y por ser tan especial. 
                <br><br>
                <strong>¡Gracias por ser vos! ❤️</strong>
            </div>
        </div>
    </div>

    <script>
        function mostrarSorpresa() {
            // Ocultar la pantalla inicial
            document.getElementById('initial-content').style.display = 'none';
            
            // Mostrar la sorpresa
            const surprise = document.getElementById('surprise');
            surprise.classList.add('show');

            // Iniciar lluvia de flores/emojis
            crearLluviaPrimavera();
        }

        function crearLluviaPrimavera() {
            const simbolos = ['🌼', '🌻', '💛', '✨', '🌸'];
            for (let i = 0; i < 25; i++) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.classList.add('falling-flower');
                    el.innerText = simbolos[Math.floor(Math.random() * simbolos.length)];
                    el.style.left = Math.random() * 100 + 'vw';
                    el.style.animationDuration = (Math.random() * 3 + 2) + 's';
                    el.style.fontSize = (Math.random() * 15 + 15) + 'px';
                    document.body.appendChild(el);

                    // Eliminar del DOM después de la animación
                    setTimeout(() => {
                        el.remove();
                    }, 5000);
                }, i * 200);
            }
        }
    </script>
</body>
</html>
